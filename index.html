<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeForge - C Academy</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial}
header{padding:22px;text-align:center;background:#1e293b}
header h1{color:#38bdf8}
nav{display:flex;flex-wrap:wrap;justify-content:center;background:#263449}
nav button,button{padding:12px 17px;margin:5px;border:0;border-radius:7px;background:#0284c7;color:white;cursor:pointer}
main{max-width:850px;margin:25px auto;padding:15px}
.card{background:#1e293b;padding:20px;border-radius:12px;margin-bottom:16px}
h2{color:#38bdf8}
pre,textarea{background:#0b1220;color:#a5f3fc;padding:14px;border-radius:8px;overflow:auto}
textarea{width:100%;min-height:180px}
.option{display:block;padding:12px;background:#334155;margin:8px;border-radius:7px}
.progress{height:10px;background:#475569;border-radius:10px}
#bar{height:10px;background:#22c55e;width:0;border-radius:10px}
</style>
</head>
<body>

<header>
<h1>CODEFORGE</h1>
<p>Learn C | Take Tests | Complete Projects</p>
</header>

<nav>
<button onclick="home()">Home</button>
<button onclick="lessons()">Lessons</button>
<button onclick="tests()">Tests</button>
<button onclick="assignments()">Assignments</button>
<button onclick="projects()">Projects</button>
</nav>

<main id="app"></main>

<script>
const data=[
["C Introduction","C is a general-purpose programming language.",
'#include <stdio.h>\nint main(){\n printf("Hello World");\n return 0;\n}'],
["Variables","Variables store data values.",
'int age=19;\nfloat marks=85.5;\nchar grade=\'A\';'],
["If Else","Conditions help programs make decisions.",
'if(n>0){\n printf("Positive");\n}else{\n printf("Negative or zero");\n}'],
["Loops","Loops repeat statements.",
'for(int i=1;i<=5;i++){\n printf("%d ",i);\n}'],
["Arrays","Arrays store multiple values.",
'int a[5]={1,2,3,4,5};\nprintf("%d",a[0]);'],
["Functions","Functions make programs reusable.",
'int add(int a,int b){\n return a+b;\n}']
];

const quiz=[
["Which function starts a C program?",["printf","main","scanf"],1],
["Which header supports printf?",["stdio.h","math.h","string.h"],0],
["Which type stores integers?",["float","char","int"],2],
["Which loop executes at least once?",["for","while","do-while"],2],
["What is the first array index?",["0","1","-1"],0],
["Which operator checks equality?",["=","==","!="],1],
["Which keyword exits a loop?",["continue","break","return"],1],
["Which keyword returns a value?",["return","printf","int"],0]
];

const tasks=[
["Even or Odd","Read an integer and check whether it is even or odd."],
["Largest Number","Find the largest among three integers."],
["Multiplication Table","Print a multiplication table from 1 to 10."],
["Factorial","Calculate factorial using a loop."],
["Prime Number","Check whether a number is prime."],
["Array Maximum","Find the largest element in an array."]
];

let done=JSON.parse(localStorage.getItem("done")||"[]");
let best=Number(localStorage.getItem("best")||0);

function home(){
document.getElementById("app").innerHTML=`
<div class="card">
<h2>Welcome to CodeForge!</h2>
<p>Your C programming classroom.</p>
<h3>Learning progress: ${done.length}/${data.length}</h3>
<div class="progress"><div id="bar"></div></div>
<p>Best test score: ${best}%</p>
</div>
<div class="card">
<h2>Start Learning</h2>
<p>Learn concepts, practise coding and test your knowledge.</p>
<button onclick="lessons()">Start</button>
</div>`;
document.getElementById("bar").style.width=
(done.length/data.length*100)+"%";
}

function lessons(){
let html="<h2>C Lessons</h2>";
data.forEach((d,i)=>{
html+=`<div class="card">
<h3>${i+1}. ${d[0]}</h3>
<p>${d[1]}</p>
<pre>${d[2].replace(/</g,"&lt;").replace(/>/g,"&gt;")}</pre>
<button onclick="complete(${i})">
${done.includes(i)?"Completed":"Mark completed"}
</button>
</div>`;
});
document.getElementById("app").innerHTML=html;
}

function complete(i){
if(!done.includes(i))done.push(i);
localStorage.setItem("done",JSON.stringify(done));
lessons();
}

function tests(){
let html=`<div class="card"><h2>C Programming Test</h2>
<p>Answer all questions and submit.</p>`;
quiz.forEach((q,i)=>{
html+=`<div class="card"><b>${i+1}. ${q[0]}</b>`;
q[1].forEach((o,j)=>{
html+=`<label class="option">
<input type="radio" name="q${i}" value="${j}"> ${o}
</label>`;
});
html+="</div>";
});
html+=`<button onclick="submitTest()">Submit Test</button>
<div id="result"></div></div>`;
document.getElementById("app").innerHTML=html;
}

function submitTest(){
let score=0;
quiz.forEach((q,i)=>{
let a=document.querySelector('input[name="q'+i+'"]:checked');
if(a&&Number(a.value)===q[2])score++;
});
let percent=Math.round(score/quiz.length*100);
best=Math.max(best,percent);
localStorage.setItem("best",best);
document.getElementById("result").innerHTML=
`<h2>Score: ${score}/${quiz.length}</h2>
<p>${percent}%</p>
<p>${percent>=75?"Excellent!":"Revise the lessons and try again."}</p>`;
}

function assignments(){
let html="<h2>Programming Assignments</h2>";
tasks.forEach((t,i)=>{
html+=`<div class="card">
<h3>Assignment ${i+1}: ${t[0]}</h3>
<p>${t[1]}</p>
</div>`;
});
html+=`<div class="card">
<h3>Submit your C program</h3>
<textarea id="code" placeholder="Write your C program here..."></textarea>
<button onclick="saveCode()">Save submission</button>
<p id="saved"></p>
</div>`;
document.getElementById("app").innerHTML=html;
}

function saveCode(){
let code=document.getElementById("code").value;
if(!code.trim()){
document.getElementById("saved").innerText="Write code first.";
return;
}
localStorage.setItem("submission",code);
document.getElementById("saved").innerText=
"Code saved successfully. Compilation and automatic evaluation will be added in the next version.";
}

function projects(){
document.getElementById("app").innerHTML=`
<h2>Mini Projects</h2>
<div class="card"><h3>1. Calculator</h3>
<p>Create a calculator using switch-case.</p></div>
<div class="card"><h3>2. Student Management System</h3>
<p>Store names, marks and calculate averages using structures.</p></div>
<div class="card"><h3>3. Number Analysis Tool</h3>
<p>Check prime, factorial, even/odd and digit sum.</p></div>
<div class="card"><h3>4. Quiz Application</h3>
<p>Build a question-answer application with a score counter.</p></div>`;
}

home();
</script>
</body>
</html>
